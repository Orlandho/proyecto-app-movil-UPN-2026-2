name: "Jules Móvil - 6. Listener de Veredictos del Sandbox"

on:
  issue_comment:
    types: [ created ]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  procesar-veredicto-sandbox:
    name: Procesar Veredicto de Sandbox Jules
    runs-on: ubuntu-latest

    # Ejecutar únicamente si el issue tiene la etiqueta 'jules' o contiene '[jules]' en el título
    if: >
      contains(github.event.issue.labels.*.name, 'jules') ||
      startsWith(github.event.issue.title, '[jules]')

    steps:
      - name: Descargar repositorio móvil
        uses: actions/checkout@v4

      - name: Configurar Node.js (Entorno del Procesador)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Procesar Comentario y Actualizar Status Check
        env:
          GITHUB_TOKEN: ${{ secrets.JULES_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          node .github/scripts/jules-verdict-processor.js
