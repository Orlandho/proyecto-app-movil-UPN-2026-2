name: "Sincronización FoodJet - Despacho a Agente Jules"

on:
  repository_dispatch:
    types: [foodjet-updated]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA del commit de Pagina-Foodjet (opcional para pruebas manuales)"
        required: false
        default: "HEAD"
      commit_message:
        description: "Mensaje o resumen del cambio en FoodJet"
        required: false
        default: "Sincronización manual iniciada desde GitHub Actions"
      author:
        description: "Autor o disparador del cambio"
        required: false
        default: "Orlandho"
      branch:
        description: "Rama de FoodJet origen"
        required: false
        default: "main"

permissions:
  contents: read
  issues: write

jobs:
  sincronizar-con-jules:
    name: Procesar Evento FoodJet y Orquestar Agente Jules
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio móvil
        uses: actions/checkout@v4

      - name: Construir prompt y cuerpo del Issue para el Agente Jules
        id: build-prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const eventPayload = context.payload;
            const isDispatch = context.eventName === 'repository_dispatch';
            const clientPayload = isDispatch ? (eventPayload.client_payload || {}) : {};

            const commitSha = clientPayload.commit_sha || clientPayload.sha || (eventPayload.inputs && eventPayload.inputs.commit_sha) || 'HEAD';
            const commitMsg = clientPayload.commit_message || clientPayload.message || (eventPayload.inputs && eventPayload.inputs.commit_message) || 'Actualizaciones detectadas en FoodJet (Web/Backend)';
            const sender = clientPayload.sender || clientPayload.author || (eventPayload.inputs && eventPayload.inputs.author) || context.actor;
            const branch = clientPayload.branch || clientPayload.ref || (eventPayload.inputs && eventPayload.inputs.branch) || 'main';
            const timestamp = new Date().toISOString();

            const shortSha = commitSha.length > 7 ? commitSha.substring(0, 7) : commitSha;
            const issueTitle = `[Sincronización FoodJet] Alinear aplicación móvil con cambios recientes en Orlandho/Pagina-Foodjet (${shortSha})`;

            const body = `# 🤖 [Agente Jules] Sincronización Automática: Alineación con FoodJet

            Se ha recibido el evento externo **\`repository_dispatch\`** con tipo **\`foodjet-updated\`** proveniente del repositorio upstream [Orlandho/Pagina-Foodjet](https://github.com/Orlandho/Pagina-Foodjet).

            ---

            ## 📌 Metadatos del Evento Externo
            - **Tipo de Evento:** \`repository_dispatch\` (\`foodjet-updated\`)
            - **Repositorio Origen:** [\`Orlandho/Pagina-Foodjet\`](https://github.com/Orlandho/Pagina-Foodjet)
            - **Rama Origen:** \`${branch}\`
            - **Commit SHA:** \`${commitSha}\`
            - **Mensaje del Cambio:** ${commitMsg}
            - **Autor / Disparador:** \`${sender}\`
            - **Marca de Tiempo (UTC):** \`${timestamp}\`

            ---

            ## 🎯 Misión del Agente Jules
            Como agente de desarrollo móvil del ecosistema **FoodJet**, tu objetivo es **revisar los cambios recientes en [Orlandho/Pagina-Foodjet](https://github.com/Orlandho/Pagina-Foodjet)** y **alinear la aplicación móvil Android Kotlin (\`FoodJet Móvil\`)** para mantener total paridad funcional, de datos y visual.

            ### Instrucciones Específicas de Alineación:
            1. **Revisión de Cambios en Orlandho/Pagina-Foodjet:**
               - Analizar las modificaciones recientes en el repositorio upstream, prestando especial atención a:
                 * \`backend/src/\`: Nuevos endpoints Express, controladores, modelos Prisma, validaciones o cambios en autenticación.
                 * \`frontend/\`: Nuevos componentes visuales, cambios de diseño en \`index.html\`, interactividad en \`js/\` y paleta cromática en \`styles.css\`.

            2. **Consumo del Backend de FoodJet:**
               - Si hubo modificaciones o adiciones de endpoints REST:
                 * Actualizar la interfaz Retrofit \`FoodJetApiService\` en \`app/src/main/java/com/example/foodjeetapp/data/remote/api/\`.
                 * Actualizar o crear los DTOs inmutables correspondientes en \`app/src/main/java/com/example/foodjeetapp/data/remote/dto/\`.
                 * Reflejar los cambios en los repositorios (\`ProductRepository\`, \`OrderRepository\`, \`UserRepository\`) y coordinar con la persistencia local Room/DataStore si aplica.

            3. **Reflejo de Componentes Visuales y Paleta del Frontend Web:**
               - Asegurar que la interfaz Jetpack Compose mantenga la paleta oficial de FoodJet definida en \`app/src/main/java/com/example/foodjeetapp/ui/theme/Color.kt\`:
                 * Primario: \`FoodJetPrimary\` (\`#F5AF69\`), \`FoodJetPrimaryDark\` (\`#F39D4A\`), \`FoodJetPrimaryLight\` (\`#FEF3E8\`).
                 * Neutros y fondos: \`FoodJetDark\` (\`#1A1A1A\`), \`FoodJetGray\` (\`#6C757D\`), \`FoodJetLightGray\` (\`#F8F9FA\`), \`FoodJetBorder\` (\`#DEE2E6\`).
               - Sincronizar componentes modulares (\`ProductCard\`, \`HeroCarousel\`, \`FilterSection\`, \`FoodJetTopBar\`, \`FoodJetBottomBar\`, \`CartSheet\`, etc.) y pantallas (\`HomeScreen\`, \`CheckoutScreen\`, \`TrackingScreen\`, etc.).

            ---

            ## 📂 Delimitación de Carpetas para Modificaciones (según AGENTS.md)
            Para guiar tus modificaciones de código sin alterar la arquitectura base, debes trabajar **estrictamente** dentro de los siguientes directorios del módulo \`app\`:
            - **Vistas e Interfaz Gráfica:**
              - \`app/src/main/java/com/example/foodjeetapp/ui/screens/\`
              - \`app/src/main/java/com/example/foodjeetapp/ui/components/\`
              - \`app/src/main/java/com/example/foodjeetapp/ui/theme/\`
            - **Gestión de Estado y Lógica (ViewModels):**
              - \`app/src/main/java/com/example/foodjeetapp/ui/viewmodel/\`
            - **Servicios de Red y Datos Remotos:**
              - \`app/src/main/java/com/example/foodjeetapp/data/remote/api/\`
              - \`app/src/main/java/com/example/foodjeetapp/data/remote/dto/\`
              - \`app/src/main/java/com/example/foodjeetapp/data/remote/interceptor/\`
              - \`app/src/main/java/com/example/foodjeetapp/data/remote/RetrofitClient.kt\`
              - \`app/src/main/java/com/example/foodjeetapp/data/repository/\`
              - \`app/src/main/java/com/example/foodjeetapp/data/model/\`

            ---

            ## ⚠️ REGLA ESTRICTA: Preservación de la Estructura Gradle Base
            - **ESTÁ ESTRICTAMENTE PROHIBIDO MODIFICAR** los archivos de compilación Gradle:
              - \`build.gradle.kts\`
              - \`settings.gradle.kts\`
              - \`gradle.properties\`
              - \`gradle/libs.versions.toml\`
              - \`app/build.gradle.kts\`
            - Todos los cambios de código deben ajustarse a las dependencias y configuración existente (AGP 8.9, Kotlin 2.1, Jetpack Compose, Java 21).

            ---
            > 🤖 **Asignado a:** Agente Jules (\`@google-jules\` / etiqueta \`jules\`)
            > 📖 **Referencia de Arquitectura:** Consulta el archivo [\`AGENTS.md\`](https://github.com/Orlandho/proyecto-app-movil-UPN-2026-2/blob/main/AGENTS.md) y [\`docs/INTEGRACION_BACKEND_FOODJET.md\`](https://github.com/Orlandho/proyecto-app-movil-UPN-2026-2/blob/main/docs/INTEGRACION_BACKEND_FOODJET.md).
            `;

            fs.writeFileSync('issue_body.md', body, 'utf8');
            core.setOutput('issue_title', issueTitle);

      - name: Crear Issue con GitHub CLI usando la etiqueta 'jules'
        id: create-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.build-prompt.outputs.issue_title }}
        run: |
          # 1. Asegurar que la etiqueta 'jules' exista en el repositorio
          echo "Verificando/creando etiqueta 'jules'..."
          gh label create jules --description "Tareas asignadas al agente autónomo Jules" --color "1D76DB" --force || true

          # 2. Crear el issue asignado a Jules
          echo "Creando Issue para Jules..."
          ISSUE_URL=$(gh issue create \
            --title "$ISSUE_TITLE" \
            --body-file issue_body.md \
            --label "jules")

          echo "ISSUE_URL=$ISSUE_URL" >> $GITHUB_ENV
          echo "::notice title=Agente Jules::Issue de sincronización creado exitosamente: $ISSUE_URL"

      - name: Invocar sesión directa del Agente Jules (si JULES_API_KEY está configurado)
        id: invoke-jules-api
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "ℹ️ Secreto JULES_API_KEY no configurado en el repositorio."
            echo "El agente Jules operará mediante el Issue creado con la etiqueta 'jules' (${{ env.ISSUE_URL }})."
            exit 0
          fi

          echo "Se detectó JULES_API_KEY. Enviando tarea directamente al Agente Jules..."
          node -e '
          const fs = require("fs");
          const apiKey = process.env.JULES_API_KEY;
          const prompt = fs.readFileSync("issue_body.md", "utf8");

          async function notifyJules() {
            try {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{
                    parts: [{
                      text: "Actúa como el agente de desarrollo y sincronización Jules. Analiza el siguiente evento de sincronización entre Orlandho/Pagina-Foodjet y la app móvil Android, y formula un plan de alineación técnico detallado:\n\n" + prompt
                    }]
                  }],
                  generationConfig: { temperature: 0.2, maxOutputTokens: 2048 }
                })
              });

              if (res.ok) {
                const data = await res.json();
                const plan = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (plan) {
                  console.log("✅ Plan preliminar del Agente Jules generado exitosamente.");
                  fs.writeFileSync("jules_plan.md", "### 🤖 Análisis Inicial y Plan de Trabajo - Agente Jules\n\n" + plan, "utf8");
                }
              } else {
                console.log("⚠️ API respondió con estado: " + res.status);
              }
            } catch (err) {
              console.log("ℹ️ Nota en invocación directa: " + err.message);
            }
          }

          notifyJules();
          '

          # Si se generó un plan preliminar y existe ISSUE_URL, agregarlo como comentario en el issue
          if [ -f jules_plan.md ] && [ -n "$ISSUE_URL" ]; then
            echo "Comentando plan preliminar de Jules en el issue $ISSUE_URL..."
            gh issue comment "$ISSUE_URL" --body-file jules_plan.md || true
          fi
