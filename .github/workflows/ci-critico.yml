name: Verificación Crítica FoodJet

on:
  pull_request:
    branches: [main]
    paths:
      - 'app-movil/**'
      - 'backend/**'
      - '.github/workflows/ci-critico.yml'
  push:
    branches: [main]
    paths:
      - 'app-movil/**'
      - 'backend/**'
      - '.github/workflows/ci-critico.yml'
  workflow_dispatch:

concurrency:
  group: ci-critico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-criticos:
    name: Puntos críticos (Android + Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificación crítica del backend (sintaxis, dominio y seed)
        working-directory: backend
        run: |
          node --check src/index.js
          node --check src/controllers/orderController.js
          node --check src/controllers/productController.js
          node --check src/controllers/authController.js
          node --check prisma/seed.js
          node --check prisma/seedProductsExtra.js
          node -e "
            const { isCancelable, isValidTransition } = require('./src/domain/orderStatus');
            const { isMetodoValido, resolvePaymentStatus } = require('./src/domain/payment');
            const { EXTRA_PRODUCTS } = require('./prisma/seedProductsExtra');
            if (!isCancelable('pendiente') || isCancelable('entregado')) process.exit(1);
            if (!isValidTransition('pendiente', 'confirmado')) process.exit(1);
            if (!isMetodoValido('cash') || !isMetodoValido('card') || !isMetodoValido('wallet')) process.exit(1);
            if (resolvePaymentStatus('card') !== 'completado') process.exit(1);
            const ids = new Set(EXTRA_PRODUCTS.map(p => p.id));
            if (EXTRA_PRODUCTS.length !== 100 || ids.size !== 100) process.exit(1);
            if (EXTRA_PRODUCTS.some(p => !p.nombre || p.precio <= 0 || ![1,2,3].includes(p.restaurante_id))) process.exit(1);
            console.log('Backend critical smoke checks OK (100 extra seed products verified)');
          "

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-root-directory: app-movil

      - name: Pruebas críticas de dominio y regresión Android
        working-directory: app-movil
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "com.example.foodjeetapp.FoodJetDomainUnitTest" \
            --tests "com.example.foodjeetapp.regression.FoodJetRegressionTest" \
            --tests "com.example.foodjeetapp.data.*" \
            --no-daemon